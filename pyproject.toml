[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analytics-command-center"
version = "0.1.0"
description = "Governed autonomous analytics agents for SQLite data"
requires-python = ">=3.10"
dependencies = [
  "openai-agents>=0.14.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "sqlglot>=25.0.0",
  "streamlit>=1.38.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0"]

[project.scripts]
analytics = "analytics_command_center.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_command_center"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "agent_eval: invokes a real OpenAI model and requires OPENAI_API_KEY",
]

[tool.ruff]
line-length = 100
target-version = "py310"
